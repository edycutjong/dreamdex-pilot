<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Pilot — an MCP server between AI agents and dreamDEX perps. Pilot refuses the agent's 0.0005 BTC short in red at the $25 cap; the 0.00031 re-issue clears green.">
<!-- STORYBOARD (dur 6s — must equal this file's single master dur)
  0-10%   steady state: the full static mark — plate, dashed cap line, the long strip with its red over-cap tail and
          grease-pencil strike, the short strip, three green lead-on lights. Poster = icon.svg.
  10-24%  trigger:      the board resets to pending — strike lifts, the tail goes back to buff card, the short strip
          and the green lights leave; one long order strip sits across the cap line.                  data-story="beat-2"
  24-55%  mechanism:    Pilot refuses the agent's 0.0005 BTC short in red at the $25 cap; the 0.00031 re-issue clears green.
          (the tail past the cap flashes red, then one grease-pencil strike draws through the strip)    data-story="beat-3"
  55-80%  resolution:   the shorter re-issue slides in under the cap; the three lights past the bar turn green one
          by one and stay lit — the refused strip stays struck beside them                             data-story="beat-4"
  80-100% breathe: red and green glows breathe once, then the mark holds the poster state into the seam
-->
  <style>
    .breath { animation: breath 6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes breath { 0%, 72% { transform: scale(1); } 82% { transform: scale(1.12); } 92%, 100% { transform: scale(1); } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <radialGradient id="lamp" cx="40%" cy="22%" r="70%">
      <stop offset="0" stop-color="#E9DDBF" stop-opacity=".10"/><stop offset="1" stop-color="#E9DDBF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="12"/></filter>
    <clipPath id="s1"><rect x="76" y="132" width="360" height="96" rx="12"/></clipPath>
  </defs>

  <!-- plate (brand layer, always visible) -->
  <rect width="512" height="512" rx="112" fill="#1A1B15"/>
  <rect width="512" height="512" rx="112" fill="url(#lamp)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#E9DDBF" stroke-opacity=".16" stroke-width="4"/>
  <line x1="344" y1="104" x2="344" y2="408" stroke="#EFE8D6" stroke-opacity=".55" stroke-width="6" stroke-linecap="round" stroke-dasharray="2 16"/>

  <!-- state glows -->
  <g filter="url(#glow)">
    <rect x="344" y="140" width="92" height="80" rx="10" fill="#FF5B33" opacity=".55">
      <animate attributeName="opacity" values=".55;.55;0.05;0.05;1;.55;.55" keyTimes="0;0.10;0.18;0.24;0.30;0.40;1" dur="6s" repeatCount="indefinite"/>
    </rect>
    <rect class="breath" x="356" y="306" width="104" height="52" rx="26" fill="#2BD47A" opacity=".55">
      <animate attributeName="opacity" values=".55;.55;0.05;0.05;1;.45;.85;.55;.55" keyTimes="0;0.10;0.18;0.62;0.70;0.78;0.86;0.92;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- lane 1: the agent's order, longer than the cap -->
  <g clip-path="url(#s1)">
    <rect x="76" y="132" width="360" height="96" fill="#E9DDBF"/>
    <rect x="344" y="132" width="92" height="96" fill="#FF5B33">
      <animate attributeName="opacity" values="1;1;0.02;0.02;1;1" keyTimes="0;0.10;0.18;0.24;0.30;1" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <path d="M160 144 V216 M252 144 V216" stroke="#22211B" stroke-opacity=".18" stroke-width="3"/>
  <g fill="#22211B" fill-opacity=".82">
    <rect x="96" y="160" width="46" height="18" rx="4"/><rect x="96" y="188" width="30" height="12" rx="3"/>
    <rect x="178" y="172" width="56" height="16" rx="4"/><rect x="270" y="172" width="56" height="16" rx="4"/>
  </g>
  <path d="M92 204 C 160 194, 240 180, 330 160" pathLength="100" fill="none" stroke="#B02D0A" stroke-width="24" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="0">
    <animate attributeName="stroke-dashoffset" values="0;0;100;100;0;0" keyTimes="0;0.10;0.18;0.34;0.46;1" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- lane 2: the re-issue, inside the cap -->
  <g>
    <animate attributeName="opacity" values="1;1;0.02;0.02;1;1" keyTimes="0;0.10;0.20;0.50;0.60;1" dur="6s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="translate" values="0 0;0 0;-60 0;-60 0;0 0;0 0" keyTimes="0;0.10;0.20;0.50;0.60;1" dur="6s" repeatCount="indefinite"/>
    <rect x="76" y="284" width="240" height="96" rx="12" fill="#E9DDBF"/>
    <path d="M160 296 V368 M236 296 V368" stroke="#22211B" stroke-opacity=".18" stroke-width="3"/>
    <g fill="#22211B" fill-opacity=".82">
      <rect x="96" y="312" width="46" height="18" rx="4"/><rect x="96" y="340" width="30" height="12" rx="3"/><rect x="176" y="324" width="44" height="16" rx="4"/>
    </g>
  </g>
  <circle cx="374" cy="332" r="15" fill="#2BD47A">
    <animate attributeName="opacity" values="1;1;0.02;0.02;1;1" keyTimes="0;0.10;0.18;0.60;0.63;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="408" cy="332" r="15" fill="#2BD47A">
    <animate attributeName="opacity" values="1;1;0.02;0.02;1;1" keyTimes="0;0.10;0.18;0.63;0.66;1" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="442" cy="332" r="15" fill="#2BD47A">
    <animate attributeName="opacity" values="1;1;0.02;0.02;1;1" keyTimes="0;0.10;0.18;0.66;0.69;1" dur="6s" repeatCount="indefinite"/>
  </circle>
</svg>
