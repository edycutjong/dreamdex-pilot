<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Pilot — an order strip that runs past your cap is struck and refused; the shorter re-issue stops inside the cap and clears green">
  <style>
    .plate  { fill: var(--bg-base, #1A1B15); }
    .rim    { fill: none; stroke: var(--strip, #E9DDBF); stroke-opacity: .16; stroke-width: 4; }
    .paper  { fill: var(--strip, #E9DDBF); }
    .tail   { fill: var(--primary, #FF5B33); }
    .go     { fill: var(--accent, #2BD47A); }
    .cap    { fill: none; stroke: var(--text-hi, #EFE8D6); stroke-opacity: .55; stroke-width: 6; stroke-linecap: round; stroke-dasharray: 2 16; }
    .typed  { fill: var(--strip-ink, #22211B); fill-opacity: .82; }
    .div    { stroke: var(--strip-ink, #22211B); stroke-opacity: .18; stroke-width: 3; }
    .strike { fill: none; stroke: var(--before-ink, #B02D0A); stroke-width: 24; stroke-linecap: round; stroke-linejoin: round; }
    .lamp-a { stop-color: var(--strip, #E9DDBF); stop-opacity: .10; }
    .lamp-b { stop-color: var(--strip, #E9DDBF); stop-opacity: 0; }
  </style>
  <defs>
    <radialGradient id="lamp" cx="40%" cy="22%" r="70%">
      <stop offset="0" class="lamp-a"/><stop offset="1" class="lamp-b"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-80%" width="180%" height="260%"><feGaussianBlur stdDeviation="10"/></filter>
    <clipPath id="s1"><rect x="76" y="132" width="360" height="96" rx="12"/></clipPath>
  </defs>

  <!-- plate: self-sufficient on GitHub light and dark -->
  <rect class="plate" width="512" height="512" rx="112"/>
  <rect class="plate" width="512" height="512" rx="112" fill="url(#lamp)" style="fill:url(#lamp)"/>
  <rect class="rim" x="6" y="6" width="500" height="500" rx="106"/>

  <!-- your cap: the stop bar every order must fit behind -->
  <line class="cap" x1="344" y1="104" x2="344" y2="408"/>

  <!-- glow under the two state signals -->
  <g filter="url(#glow)" opacity=".55">
    <rect class="tail" x="344" y="140" width="92" height="80" rx="10"/>
    <rect class="go" x="356" y="306" width="104" height="52" rx="26"/>
  </g>

  <!-- lane 1: the agent's order, longer than your cap — tail past the bar, struck through -->
  <g clip-path="url(#s1)">
    <rect class="paper" x="76" y="132" width="360" height="96"/>
    <rect class="tail" x="344" y="132" width="92" height="96"/>
  </g>
  <line class="div" x1="160" y1="144" x2="160" y2="216"/>
  <line class="div" x1="252" y1="144" x2="252" y2="216"/>
  <rect class="typed" x="96" y="160" width="46" height="18" rx="4"/>
  <rect class="typed" x="96" y="188" width="30" height="12" rx="3"/>
  <rect class="typed" x="178" y="172" width="56" height="16" rx="4"/>
  <rect class="typed" x="270" y="172" width="56" height="16" rx="4"/>
  <path class="strike" d="M92 204 C 160 194, 240 180, 330 160"/>

  <!-- lane 2: the re-issue, short enough to stop inside the cap — cleared, lead-on lights green -->
  <rect class="paper" x="76" y="284" width="240" height="96" rx="12"/>
  <line class="div" x1="160" y1="296" x2="160" y2="368"/>
  <line class="div" x1="236" y1="296" x2="236" y2="368"/>
  <rect class="typed" x="96" y="312" width="46" height="18" rx="4"/>
  <rect class="typed" x="96" y="340" width="30" height="12" rx="3"/>
  <rect class="typed" x="176" y="324" width="44" height="16" rx="4"/>
  <circle class="go" cx="374" cy="332" r="15"/>
  <circle class="go" cx="408" cy="332" r="15"/>
  <circle class="go" cx="442" cy="332" r="15"/>
</svg>
